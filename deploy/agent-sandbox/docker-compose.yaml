services:
  agent-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: k8s-agent-sandbox:latest
    container_name: agent-sandbox-runtime
    ports:
      - "8888:8888"
    environment:
      - SANDBOX_BASE_DIR=/tmp/agent-sandbox-data
      - PORT=8888
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:exec,mode=1777
