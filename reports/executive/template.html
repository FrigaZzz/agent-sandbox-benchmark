<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Agent sandboxes · Executive field guide</title>
<style>
:root{--paper:#faf7f0;--ink:#17272e;--muted:#59636a;--accent:#006c67;--line:#d8d6d0}*{box-sizing:border-box}body{margin:0;background:#e9e7e2;color:var(--ink);font:24px/1.4 system-ui,sans-serif}main{max-width:1248px;padding:24px;margin:auto}.slide{display:none;background:var(--paper);min-height:900px;padding:40px 48px;border:1px solid var(--line);flex-direction:column}.slide.active{display:flex}.eyebrow{font:600 16px/1.5 system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 24px}h1{font-size:72px;line-height:1.05;letter-spacing:-.04em;margin:32px 0}h2{font-size:44px;line-height:1.15;letter-spacing:-.03em;margin:0 0 24px}h3{font-size:28px;margin:0 0 16px}p{margin:16px 0}.lead{font-size:28px;max-width:850px}img{display:block;width:100%;height:auto;max-height:500px;object-fit:contain}.flow{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:48px 0;padding:24px 0;border-block:3px solid var(--accent)}a{color:var(--accent);text-underline-offset:4px}.jobs{display:grid;grid-template-columns:1fr 1fr;gap:32px}.jobs article{border-top:3px solid var(--accent);padding:20px 0}.jobs b{font-size:21px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:20px;margin:24px 0}th,td{text-align:left;padding:16px 12px;border-bottom:1px solid var(--line)}footer{margin-top:auto;padding-top:24px;font-size:17px;color:var(--muted)}footer p{margin:8px 0}.links{display:grid;gap:24px;margin:32px 0}.controls{display:flex;align-items:center;justify-content:center;gap:24px;padding:16px}button{font:inherit;background:var(--paper);border:1px solid var(--accent);color:var(--accent);padding:8px 16px;cursor:pointer}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.slide img{max-height:450px}
@media(max-width:800px){body{font-size:19px}main{padding:12px}.slide{padding:24px;min-height:800px}h1{font-size:44px}h2{font-size:32px}.lead{font-size:22px}.jobs{grid-template-columns:1fr;gap:16px}table{font-size:17px}footer{font-size:15px}.flow{flex-direction:column;margin:24px 0}.slide img{max-height:none}.eyebrow{font-size:13px}.controls{gap:12px;font-size:16px}}
@page{size:1200px 900px;margin:0}@media print{body{background:var(--paper);width:1200px;-webkit-print-color-adjust:exact;print-color-adjust:exact}main{padding:0;max-width:none}.slide,.slide.active{display:flex;width:1200px;height:900px;min-height:0;border:0;break-after:page}.slide:last-child{break-after:auto}.controls{display:none}a{color:var(--accent)}}
</style></head><body><main>__SLIDES__</main><div class="controls"><button id="previous">← Previous</button><span id="position" role="status" aria-live="polite"></span><button id="next">Next →</button></div>
<script>
const slides=[...document.querySelectorAll('.slide')];let current=0;
function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',i===current?'false':'true')});document.getElementById('position').textContent=`${current+1} / ${slides.length}`;document.getElementById('previous').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1}
document.getElementById('previous').addEventListener('click',()=>show(current-1));document.getElementById('next').addEventListener('click',()=>show(current+1));document.addEventListener('keydown',e=>{if(e.target.closest('button,a,input,select,textarea'))return;if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();show(e.key==='Home'?0:e.key==='End'?slides.length-1:current+(e.key==='ArrowRight'?1:-1))}});show(0);
</script></body></html>
