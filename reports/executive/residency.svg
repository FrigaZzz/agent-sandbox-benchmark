<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" role="img" aria-label="One region selector. Six data surfaces."><rect width="1200" height="592" fill="#faf7f0"/><g font-family="system-ui,sans-serif" fill="#17272e"><text x="40" y="65" font-size="36" font-weight="700">One region selector. Six data surfaces.</text><text x="40" y="130" font-size="28" fill="#006c67">01 / Compute</text><text x="40" y="161" font-size="23">Where code runs and data is processed</text><text x="40" y="207" font-size="28" fill="#006c67">02 / Stored copies</text><text x="40" y="238" font-size="23">Files, volumes, images, snapshots and backups</text><text x="40" y="284" font-size="28" fill="#006c67">03 / Logs / traces</text><text x="40" y="315" font-size="23">What stdout, stderr and telemetry retain</text><text x="40" y="361" font-size="28" fill="#006c67">04 / Control plane</text><text x="40" y="392" font-size="23">Account data and lifecycle metadata</text><text x="40" y="438" font-size="28" fill="#006c67">05 / Support / subprocessors</text><text x="40" y="469" font-size="23">Who can access data, and from where</text><text x="40" y="515" font-size="28" fill="#006c67">06 / Model / API calls</text><text x="40" y="546" font-size="23">Where the next service processes the payload</text></g></svg>