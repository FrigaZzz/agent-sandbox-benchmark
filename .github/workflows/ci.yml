name: Offline evidence checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -s tests -v
      - name: Bounded host control (no cloud credentials)
        run: python -m src.cli run --backend local --suite cold_start,artifact_roundtrip --repeats 1 --budget-cap-usd 0.01 --output "$RUNNER_TEMP/control/runs.json"
      - run: python scripts/validate_evidence.py
      - run: python scripts/check_publication.py
      - name: Verify packaging includes runtime assets
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
