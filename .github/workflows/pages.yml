name: Benchmark portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - run: python -m src.cli specs
      - run: python -m src.cli dashboard
      - run: python reports/variant/build_variant.py
      - run: python reports/ui/build_ui.py
      - run: python reports/executive/build_deck.py
      - run: python scripts/stage_pages.py --output "$RUNNER_TEMP/portal"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/portal
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
